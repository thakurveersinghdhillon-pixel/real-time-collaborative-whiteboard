services:
  redis:
    image: redis:7-alpine
    container_name: whiteboard-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: whiteboard-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: whiteboard
      POSTGRES_PASSWORD: whiteboard
      POSTGRES_DB: whiteboard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U whiteboard -d whiteboard']
      interval: 5s
      timeout: 5s
      retries: 10

  server-1:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: whiteboard-server-1
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      INSTANCE_ID: server-1
      DATABASE_URL: postgresql://whiteboard:whiteboard@postgres:5432/whiteboard
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production-super-secret-jwt-key-phase8
      CORS_ORIGIN: '*'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:3001/health/live", (res) => process.exit(res.statusCode === 200 ? 0 : 1))']
      interval: 10s
      timeout: 5s
      retries: 5

  server-2:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    container_name: whiteboard-server-2
    ports:
      - '3002:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      INSTANCE_ID: server-2
      DATABASE_URL: postgresql://whiteboard:whiteboard@postgres:5432/whiteboard
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production-super-secret-jwt-key-phase8
      CORS_ORIGIN: '*'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:3001/health/live", (res) => process.exit(res.statusCode === 200 ? 0 : 1))']
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: whiteboard-web
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    healthcheck:
      test: ['CMD', 'node', '-e', 'require("http").get("http://localhost:3000", (res) => process.exit(res.statusCode === 200 ? 0 : 1))']
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: whiteboard-nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      server-1:
        condition: service_healthy
      server-2:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres_data:
